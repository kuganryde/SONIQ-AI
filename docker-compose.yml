version: '3.8'

services:
  soniq-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soniq-ai-backend
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8008
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./backend/storage:/app/storage

  soniq-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soniq-ai-frontend
    restart: unless-stopped
    ports:
      - "3030:3030"
    depends_on:
      - soniq-backend
